[supervisord]
nodaemon=true
logfile=/var/log/gptapi/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/var/log/gptapi/xvfb.log
redirect_stderr=true

[program:openbox]
command=/usr/local/bin/wait-x openbox
priority=20
autorestart=true
stdout_logfile=/var/log/gptapi/openbox.log
redirect_stderr=true

[program:chromium]
command=/usr/local/bin/start-chromium
priority=30
autorestart=true
startsecs=5
startretries=1000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/gptapi/chromium.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:x11vnc]
command=/usr/local/bin/wait-x x11vnc -display %(ENV_DISPLAY)s -forever -shared -nopw -localhost -rfbport %(ENV_VNC_PORT)s -quiet
priority=40
autorestart=true
stdout_logfile=/var/log/gptapi/x11vnc.log
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:%(ENV_NOVNC_PORT)s 127.0.0.1:%(ENV_VNC_PORT)s
priority=50
autorestart=true
stdout_logfile=/var/log/gptapi/novnc.log
redirect_stderr=true

; API server hook: start-api runs `python -m gptapi` from /app when /app/gptapi exists,
; otherwise it logs and exits 0 (not restarted).
[program:gptapi]
command=/usr/local/bin/start-api
priority=60
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/var/log/gptapi/api.log
redirect_stderr=true
